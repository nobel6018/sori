name: build

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다. 푸시마다 Windows 빌드가 겹쳐 쌓이지 않게 한다
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # C 런타임 설정을 바꾸면 예전 /MD로 빌드된 whisper.cpp 캐시를 쓰지 않게 키를 올린다
          prefix-key: v2-msvc-mt
      - run: pnpm install --frozen-lockfile
      # 프론트 빌드 결과(dist)가 있어야 tauri::generate_context!가 컴파일된다
      - run: pnpm build
      # 빌드와 실행을 나눠, 멈추면 컴파일인지 테스트 실행인지 바로 구분한다
      - name: cargo test (build)
        working-directory: src-tauri
        run: cargo test --locked --lib --no-run
      - name: cargo test (run)
        working-directory: src-tauri
        timeout-minutes: 10
        run: cargo test --locked --lib -- --test-threads=1 --nocapture
      # whisper.cpp와 onnxruntime 정적 링크가 실제 실행 파일에서 깨지지 않는지 확인한다
      - name: cargo build
        working-directory: src-tauri
        run: cargo build --locked --bins --examples

  # 모델 설치 스크립트를 실제 OS에서 돌려 본다. 큰 Whisper 모델(1.6GB)은 빼고 화자 분리 모델만 받는다
  install-models:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: macOS 스크립트 (기본 폴더)
        if: runner.os == 'macOS'
        run: |
          ./scripts/install-models.sh --whisper none
          D="$HOME/Library/Application Support/com.nobel6018.sori/models"
          test -s "$D/pyannote-segmentation-3-0.onnx"
          test -s "$D/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx"
          # 두 번째 실행은 이미 있는 파일을 건너뛴다
          ./scripts/install-models.sh --whisper none | grep -c "이미 있음" | grep -qx 2
      - name: macOS 스크립트 (curl | bash)
        if: runner.os == 'macOS'
        run: cat scripts/install-models.sh | bash -s -- --whisper none --dir "$RUNNER_TEMP/piped"
      # Windows에 기본으로 들어 있는 PowerShell 5.1로 돌린다. BOM이 없으면 여기서 한글이 깨진다
      - name: Windows 스크립트 (PowerShell 5.1, 기본 폴더)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\install-models.ps1 -Whisper none
          $D = Join-Path $env:APPDATA 'com.nobel6018.sori\models'
          if (-not (Test-Path (Join-Path $D 'pyannote-segmentation-3-0.onnx'))) { throw '화자 구간 모델이 없습니다' }
          if (-not (Test-Path (Join-Path $D '3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx'))) { throw '임베딩 모델이 없습니다' }
          $again = .\scripts\install-models.ps1 -Whisper none 6>&1 | Out-String
          if (($again | Select-String -AllMatches '이미 있음').Matches.Count -ne 2) { throw "두 번째 실행이 파일을 건너뛰지 않았습니다: $again" }
      # README의 한 줄 설치 명령과 같은 방식(문자열로 받아 실행)으로 돌린다
      - name: Windows 스크립트 (irm 방식, PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = Get-Content -Raw -Encoding utf8 .\scripts\install-models.ps1
          & ([scriptblock]::Create($src)) -Whisper none -Dir (Join-Path $env:RUNNER_TEMP 'piped')
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'piped\pyannote-segmentation-3-0.onnx'))) { throw '화자 구간 모델이 없습니다' }
