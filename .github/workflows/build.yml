name: build

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다. 푸시마다 Windows 빌드가 겹쳐 쌓이지 않게 한다
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # C 런타임 설정을 바꾸면 예전 /MD로 빌드된 whisper.cpp 캐시를 쓰지 않게 키를 올린다
          prefix-key: v3-msvc-mt
      - run: pnpm install --frozen-lockfile
      # 프론트 빌드 결과(dist)가 있어야 tauri::generate_context!가 컴파일된다
      - run: pnpm build
      # 빌드와 실행을 나눠, 멈추면 컴파일인지 테스트 실행인지 바로 구분한다
      - name: cargo test (build)
        working-directory: src-tauri
        run: cargo test --locked --lib --no-run
      - name: cargo test (run)
        working-directory: src-tauri
        timeout-minutes: 10
        run: cargo test --locked --lib -- --test-threads=1 --nocapture
      # whisper.cpp와 onnxruntime 정적 링크가 실제 실행 파일에서 깨지지 않는지 확인한다
      - name: cargo build
        working-directory: src-tauri
        run: cargo build --locked --bins --examples
      # 엔진 전체(디코딩, 화자 분리, 전사)를 실제 OS에서 돌려 본다. 작은 tiny 모델과 40초 3개 언어 녹음을 쓴다
      - uses: actions/cache@v4
        with:
          path: smoke-models
          key: smoke-models-v1
      - name: smoke 모델 받기
        shell: bash
        run: |
          mkdir -p smoke-models && cd smoke-models
          get() { [ -s "$2" ] || curl -fsSL --retry 3 -o "$2" "$1"; }
          get https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin ggml-tiny.bin
          get https://huggingface.co/csukuangfj/sherpa-onnx-pyannote-segmentation-3-0/resolve/main/model.onnx pyannote-segmentation-3-0.onnx
          get https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx 3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
          ls -la
      - name: smoke (엔진 전체 실행)
        shell: bash
        working-directory: src-tauri
        timeout-minutes: 10
        run: cargo run --locked --example smoke -- ../smoke-models

  # 모델 설치 스크립트를 실제 OS에서 돌려 본다. 큰 Whisper 모델(1.6GB)은 빼고 화자 분리 모델만 받는다
  install-models:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: macOS 스크립트 (기본 폴더)
        if: runner.os == 'macOS'
        run: |
          ./scripts/install-models.sh --whisper none
          D="$HOME/Library/Application Support/com.nobel6018.sori/models"
          test -s "$D/pyannote-segmentation-3-0.onnx"
          test -s "$D/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx"
          # 두 번째 실행은 이미 있는 파일을 건너뛴다
          ./scripts/install-models.sh --whisper none | grep -c "이미 있음" | grep -qx 2
      - name: macOS 스크립트 (curl | bash)
        if: runner.os == 'macOS'
        run: cat scripts/install-models.sh | bash -s -- --whisper none --dir "$RUNNER_TEMP/piped"
      # Windows에 기본으로 들어 있는 PowerShell 5.1로 돌린다.
      # Actions는 아래 run 내용을 BOM 없는 임시 .ps1로 저장해 5.1이 한글을 깨뜨려 읽으므로, 여기는 ASCII만 쓴다
      - name: Windows script (PowerShell 5.1, default folder)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\install-models.ps1 -Whisper none
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $D = Join-Path $env:APPDATA 'com.nobel6018.sori\models'
          $files = 'pyannote-segmentation-3-0.onnx', '3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx'
          foreach ($f in $files) { if (-not (Test-Path (Join-Path $D $f))) { throw "missing $f" } }
          # second run must skip existing files (timestamps unchanged)
          $before = $files | ForEach-Object { (Get-Item (Join-Path $D $_)).LastWriteTimeUtc }
          .\scripts\install-models.ps1 -Whisper none
          $after = $files | ForEach-Object { (Get-Item (Join-Path $D $_)).LastWriteTimeUtc }
          if (Compare-Object $before $after) { throw 'second run re-downloaded existing files' }
      # README의 한 줄 설치 명령과 같은 방식(문자열로 받아 실행)으로 돌린다
      - name: Windows script (scriptblock, PowerShell 7, path with space)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'piped dir'
          $src = Get-Content -Raw -Encoding utf8 .\scripts\install-models.ps1
          & ([scriptblock]::Create($src)) -Whisper none -Dir $dir
          if (-not (Test-Path (Join-Path $dir 'pyannote-segmentation-3-0.onnx'))) { throw 'missing segmentation model' }
