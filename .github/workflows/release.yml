name: release

# v로 시작하는 태그를 올리면 macOS, Windows 설치 파일을 만들어 GitHub Release에 붙인다
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      # 한 플랫폼이 실패해도 성공한 플랫폼의 설치 파일은 올린다
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v2-msvc-mt
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: sori ${{ github.ref_name }}
          releaseBody: |
            로컬에서 녹음을 받아 적고(whisper.cpp) 화자를 나누는(sherpa-onnx) 데스크탑 앱입니다.

            ## 설치
            - macOS (Apple Silicon): `.dmg`
            - Windows: `.msi` 또는 `-setup.exe`

            코드 서명을 하지 않은 빌드입니다.
            - macOS: 처음 열 때 "확인되지 않은 개발자" 경고가 뜨면 Finder에서 앱을 우클릭해 "열기"를 누릅니다
            - Windows: SmartScreen 경고가 뜨면 "추가 정보"를 눌러 "실행"을 누릅니다

            ## 모델
            모델은 설치 파일에 들어 있지 않습니다. 받은 뒤 앱의 설정에서 경로를 지정합니다. README의 "준비물"을 참고하세요.
          releaseDraft: false
          prerelease: true
