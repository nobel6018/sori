name: release

# v로 시작하는 태그를 올리면 macOS, Windows 설치 파일과 iPhone 앱(.ipa)을 만들어 GitHub Release에 붙인다.
# 플랫폼마다 빌드가 끝나는 대로 바로 올린다. 처음 끝난 작업이 Release를 만든다.
#
# main에 push할 때도 빌드만 돌려 릴리스 빌드 캐시를 데워 둔다. GitHub 캐시는 브랜치(기본 브랜치 포함) 단위라
# 태그에서 만든 캐시는 다음 태그가 못 읽는다. main에서 만든 캐시는 모든 태그가 읽는다.
# 이게 없으면 태그마다 whisper.cpp와 sherpa-onnx를 릴리스 프로필로 처음부터 빌드해 Windows가 12분 걸렸다
on:
  push:
    tags: ["v*"]
    branches: [main]
  # 태그 없이 설치 파일 빌드만 시험할 때. 게시는 하지 않는다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 같은 ref는 하나씩 돈다. 도는 중인 것은 끝까지 두고(취소하면 캐시를 저장하지 못한다),
  # 기다리는 것은 가장 최근 push 하나만 남는다
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    strategy:
      # 한 플랫폼이 실패해도 다른 플랫폼은 끝까지 만들어 올린다
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # build.yml의 디버그 빌드 캐시(작업 이름이 같은 build였다)를 가져오지 않도록 릴리스 전용 키를 쓴다
          prefix-key: v1-release-msvc-mt
          shared-key: desktop
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Release에 올리기
        if: env.IS_TAG == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # macOS 기본 bash는 3.2라 mapfile이 없다(v0.6.2, v0.7.0에서 dmg가 빠진 원인)
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then echo "올릴 설치 파일이 없습니다"; exit 1; fi
          .github/scripts/upload-release.sh "${files[@]}"

  # iPhone 앱. AltStore가 설치할 때 본인 Apple ID로 서명하므로 서명 없이 빌드해 .ipa로 묶는다(docs/mobile.md)
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
          prefix-key: v1-release
          shared-key: ios
      - run: pnpm install --frozen-lockfile
      - run: brew install xcodegen
      # 빌드는 되고 내보내기(서명) 단계에서 실패한다. 빌드된 .app이 있는지는 다음 단계에서 확인한다
      - name: 빌드
        working-directory: mobile
        run: pnpm tauri ios build --target aarch64 --ci || true
      - name: .ipa로 묶기
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*release-iphoneos/sori.app' -maxdepth 6 | head -1)
          if [ -z "$app" ]; then echo "빌드된 sori.app이 없습니다"; exit 1; fi
          mkdir -p ipa/Payload && cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../sori-ios.ipa Payload)
          ls -la sori-ios.ipa
      - name: Release에 올리기
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: .github/scripts/upload-release.sh sori-ios.ipa
