name: release

# v로 시작하는 태그를 올리면 macOS, Windows 설치 파일을 만들어 GitHub Release에 붙인다
on:
  push:
    tags: ["v*"]
  # 태그 없이 설치 파일 빌드만 시험할 때. 게시는 하지 않는다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 설치 파일을 만들어 아티팩트로만 남긴다. Release는 아래 publish가 한 번에 만든다
  build:
    strategy:
      # 한 플랫폼이 실패해도 다른 플랫폼은 끝까지 만든다
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v2-msvc-mt
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: sori-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

  publish:
    needs: build
    # 한쪽이 실패해도 성공한 쪽 파일은 올린다. 수동 실행(태그 아님)에서는 올리지 않는다
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          cat > notes.md <<'NOTES'
          로컬에서 녹음을 받아 적고(whisper.cpp) 화자를 나누는(sherpa-onnx) 데스크탑 앱입니다.

          ## 설치
          - macOS (Apple Silicon): `.dmg`
          - Windows: `.msi` 또는 `-setup.exe`

          코드 서명을 하지 않은 빌드입니다.
          - macOS: 처음 열 때 "확인되지 않은 개발자" 경고가 뜨면 Finder에서 앱을 우클릭해 "열기"를 누릅니다
          - Windows: SmartScreen 경고가 뜨면 "추가 정보"를 눌러 "실행"을 누릅니다

          ## 모델
          앱을 처음 켜면 모델 설치 화면이 뜹니다. 버튼을 누르면 받아 적기 모델(1.6GB)과 화자 분리 모델을 받습니다.
          NOTES
          # 아티팩트는 msi/, nsis/, dmg/ 하위 폴더째 받아지므로 파일만 골라 올린다.
          # 하나도 없으면 빈 Release를 만들지 않고 실패한다
          mapfile -d '' files < <(find dist -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then echo "올릴 설치 파일이 없습니다"; exit 1; fi
          printf '%s\n' "${files[@]}"
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "sori $TAG" --notes-file notes.md --prerelease
