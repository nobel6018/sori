name: release

# v로 시작하는 태그를 올리면 macOS, Windows 설치 파일과 iPhone 앱(.ipa)을 만들어 GitHub Release에 붙인다.
# 플랫폼마다 빌드가 끝나는 대로 바로 올린다. 처음 끝난 작업이 Release를 만든다.
#
# 릴리스 빌드 캐시는 일주일에 한 번 main에서 데워 둔다. GitHub 캐시는 브랜치(기본 브랜치 포함) 단위라
# 태그에서 만든 캐시는 다음 태그가 못 읽고, main에서 만든 캐시는 모든 태그가 읽는다. 캐시가 없으면
# whisper.cpp와 sherpa-onnx를 처음부터 빌드해 Windows가 12분 걸렸다.
# rust-cache는 Cargo.lock이 달라도 같은 prefix의 가장 최근 캐시를 이어 쓰므로, 버전만 올린 태그도 main 캐시로 빠르다.
# main push마다 데우던 것은 뺐다(버전을 올리면 Cargo.toml, Cargo.lock이 바뀌어 매번 돌았고 태그 빌드와 겹쳤다).
# 의존성을 크게 바꾼 직후에는 Actions에서 release를 손으로 한 번 돌리면(workflow_dispatch) 다음 태그가 빠르다
on:
  push:
    tags: ["v*"]
  schedule:
    # 월요일 03:00 KST
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 같은 ref는 하나씩 돈다. 도는 중인 것은 끝까지 두고(취소하면 캐시를 저장하지 못한다),
  # 기다리는 것은 가장 최근 push 하나만 남는다
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    strategy:
      # 한 플랫폼이 실패해도 다른 플랫폼은 끝까지 만들어 올린다
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # 러너 이미지가 바뀌면(VS, CMake 경로 등) 캐시가 맞아도 whisper-rs-sys, sherpa-rs-sys의 build.rs가 다시 돌아
      # Windows가 10분 더 걸렸다(v0.9.11, 이미지 20261021 → 20261030). rust-cache는 키가 정확히 맞으면 저장하지 않아
      # 주간 데우기도 소용없었다. 이미지 버전을 키에 넣어 새 이미지에서는 한 번 빌드해 새로 저장한다.
      # shared-key를 쓰면 rust-cache의 key 입력은 무시되므로(작업별 키에만 붙는다) shared-key에 넣는다
      - name: 러너 이미지 버전을 캐시 키로
        shell: bash
        run: echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # build.yml의 디버그 빌드 캐시(작업 이름이 같은 build였다)를 가져오지 않도록 릴리스 전용 키를 쓴다
          prefix-key: v1-release-msvc-mt
          shared-key: desktop-${{ env.RUNNER_IMAGE }}
      - run: pnpm install --frozen-lockfile
      # createUpdaterArtifacts가 켜져 있어 업데이트 파일(.app.tar.gz, setup.exe)과 서명(.sig)도 만든다(docs/update.md)
      - run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Release에 올리기
        if: env.IS_TAG == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # macOS 기본 bash는 3.2라 mapfile이 없다(v0.6.2, v0.7.0에서 dmg가 빠진 원인)
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \) -print0)
          # macOS 업데이트 파일은 이름이 sori.app.tar.gz로 고정이라 버전과 아키텍처를 붙여 올린다
          app=src-tauri/target/release/bundle/macos/sori.app.tar.gz
          if [ -f "$app" ]; then
            cp "$app" "sori_${TAG#v}_aarch64.app.tar.gz"
            cp "$app.sig" "sori_${TAG#v}_aarch64.app.tar.gz.sig"
            files+=("sori_${TAG#v}_aarch64.app.tar.gz" "sori_${TAG#v}_aarch64.app.tar.gz.sig")
          fi
          if [ "${#files[@]}" -eq 0 ]; then echo "올릴 설치 파일이 없습니다"; exit 1; fi
          .github/scripts/upload-release.sh "${files[@]}"

  # 데스크톱 앱이 읽는 업데이트 목록(releases/latest/download/latest.json). 두 OS 파일이 다 올라간 뒤 만든다
  updater:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: latest.json 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: .github/scripts/updater-manifest.sh
      - name: Release에 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: .github/scripts/upload-release.sh latest.json

  # 모든 파일이 붙으면 초안을 공개한다. 그 전까지 releases/latest는 이전 버전을 가리켜 업데이트 확인과 AltStore가 깨지지 않는다.
  # 하나라도 실패하면 초안으로 남는다(Releases 화면에서 확인하고 고쳐서 다시 태그를 올린다)
  publish:
    needs: [desktop, updater, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Release 공개
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # iPhone 앱. AltStore가 설치할 때 본인 Apple ID로 서명하므로 서명 없이 빌드해 .ipa로 묶는다(docs/mobile.md)
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
          prefix-key: v1-release
          shared-key: ios
      - run: pnpm install --frozen-lockfile
      - run: brew install xcodegen
      # 빌드는 되고 내보내기(서명) 단계에서 실패한다. 빌드된 .app이 있는지는 다음 단계에서 확인한다
      - name: 빌드
        working-directory: mobile
        run: pnpm tauri ios build --target aarch64 --ci || true
      - name: .ipa로 묶기
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*release-iphoneos/sori.app' -maxdepth 6 | head -1)
          if [ -z "$app" ]; then echo "빌드된 sori.app이 없습니다"; exit 1; fi
          mkdir -p ipa/Payload && cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../sori-ios.ipa Payload)
          ls -la sori-ios.ipa
      # 앱 안 새 버전 알림은 Release 태그와 앱 버전을 비교한다(src/updateCheck.ts).
      # 모바일 버전을 올리지 않고 태그를 달면 iPhone이 영영 새 버전이 있다고 알리고 AltStore는 업데이트를 띄우지 않는다(v0.13.0)
      - name: 앱 버전이 태그와 같은지 확인
        if: env.IS_TAG == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - ipa/Payload/sori.app/Info.plist)
          if [ "v$version" != "$TAG" ]; then
            echo "iPhone 앱 버전 $version이 태그 $TAG와 다릅니다. mobile/의 버전도 올리세요"
            exit 1
          fi
      # AltStore 소스. iPhone AltStore가 releases/latest/download/apps.json을 읽어 새 버전을 알린다(docs/mobile.md)
      - name: AltStore 소스 만들기
        env:
          TAG: ${{ github.ref_name }}
        run: |
          .github/scripts/altstore-source.sh ipa/Payload/sori.app sori-ios.ipa "$TAG" > apps.json
          cat apps.json
      - name: Release에 올리기
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: .github/scripts/upload-release.sh sori-ios.ipa apps.json
