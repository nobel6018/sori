name: release

# v로 시작하는 태그를 올리면 macOS, Windows 설치 파일과 iPhone 앱(.ipa)을 만들어 GitHub Release에 붙인다
on:
  push:
    tags: ["v*"]
  # 태그 없이 설치 파일 빌드만 시험할 때. 게시는 하지 않는다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 설치 파일을 만들어 아티팩트로만 남긴다. Release는 아래 publish가 한 번에 만든다
  build:
    strategy:
      # 한 플랫폼이 실패해도 다른 플랫폼은 끝까지 만든다
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v3-msvc-mt
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: sori-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

  # iPhone 앱. AltStore가 설치할 때 본인 Apple ID로 서명하므로 서명 없이 빌드해 .ipa로 묶는다(docs/mobile.md)
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: brew install xcodegen
      # 빌드는 되고 내보내기(서명) 단계에서 실패한다. 빌드된 .app이 있는지는 다음 단계에서 확인한다
      - name: 빌드
        working-directory: mobile
        run: pnpm tauri ios build --target aarch64 --ci || true
      - name: .ipa로 묶기
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*release-iphoneos/sori.app' -maxdepth 6 | head -1)
          if [ -z "$app" ]; then echo "빌드된 sori.app이 없습니다"; exit 1; fi
          mkdir -p ipa/Payload && cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../sori-ios.ipa Payload)
          ls -la sori-ios.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: sori-iOS
          if-no-files-found: error
          path: sori-ios.ipa

  publish:
    needs: [build, ios]
    # 한쪽이 실패해도 성공한 쪽 파일은 올린다. 수동 실행(태그 아님)에서는 올리지 않는다
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          cat > notes.md <<'NOTES'
          로컬에서 녹음을 받아 적고(whisper.cpp) 화자를 나누는(sherpa-onnx) 데스크탑 앱입니다.

          ## 설치
          - macOS (Apple Silicon): `.dmg`
          - Windows: `.msi` 또는 `-setup.exe`
          - iPhone: `sori-ios.ipa`를 AltStore로 설치합니다([설치 방법](https://github.com/nobel6018/sori/blob/main/docs/mobile.md))

          코드 서명을 하지 않은 빌드입니다.
          - macOS: dmg에서 `sori.app`을 응용 프로그램 폴더로 옮긴 뒤 터미널에서 아래 명령을 한 번 실행합니다. 브라우저로 받은 파일에 붙는 격리 표시를 지워, "손상되었기 때문에 열 수 없습니다" 경고 없이 열립니다

            ```sh
            xattr -cr /Applications/sori.app
            ```
          - Windows: SmartScreen 경고가 뜨면 "추가 정보"를 눌러 "실행"을 누릅니다

          ## 모델
          앱을 처음 켜면 모델 설치 화면이 뜹니다. 버튼을 누르면 받아 적기 모델(1.6GB)과 화자 분리 모델을 받습니다.
          NOTES
          # 아티팩트는 msi/, nsis/, dmg/ 하위 폴더째 받아지므로 파일만 골라 올린다.
          # 하나도 없으면 빈 Release를 만들지 않고 실패한다
          mapfile -d '' files < <(find dist -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.ipa' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then echo "올릴 설치 파일이 없습니다"; exit 1; fi
          printf '%s\n' "${files[@]}"
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "sori $TAG" --notes-file notes.md
