[package]
name = "sori-sync"
version = "0.1.0"
edition = "2024"
description = "sori 기기 간 동기화 엔진. 데스크톱과 모바일 앱이 함께 쓴다 (docs/sync.md)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eyre = "0.6.14"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
uuid = { version = "1.29.0", features = ["v4"] }
