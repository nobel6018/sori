# 미리 빌드된 sherpa-onnx Windows 정적 라이브러리는 C 런타임을 정적(/MT)으로 넣었다.
# Rust와 whisper.cpp도 /MT로 맞추지 않으면 msvcrt와 LIBCMT가 섞여 링크가 깨진다.
# onnxruntime이 쓰는 ETW 로깅과 레지스트리 함수(advapi32)는 sherpa-rs가 링크하지 않아 직접 넣는다
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=advapi32.lib"]

# whisper.cpp도 sherpa-onnx와 같은 정적 릴리스 런타임(/MT)으로 빌드한다.
# whisper.cpp는 cmake_minimum_required(3.5)라 CMP0091 정책이 꺼져 있어 CMAKE_MSVC_RUNTIME_LIBRARY를
# 무시한다. 정하지 않은 정책의 기본값을 NEW로 바꿔 이 변수가 먹게 한다.
# whisper-rs-sys가 CMAKE_로 시작하는 환경 변수를 CMake에 그대로 넘긴다.
# MSVC가 아닌 컴파일러(macOS clang)에서는 CMake가 이 값을 쓰지 않는다
[env]
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
