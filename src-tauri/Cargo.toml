[package]
name = "sori"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.16"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"] }
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3", "wav", "flac", "ogg", "vorbis", "pcm", "alac", "mkv"] }
rubato = "0.16"
hound = "3.5"
eyre = "0.6.14"
thiserror = "2"
uuid = { version = "1.29.0", features = ["v4"] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1", features = ["sync", "process", "io-util", "time", "macros", "rt"] }
cpal = "0.18"

# whisper.cpp GPU 백엔드는 플랫폼마다 다르다. macOS는 Metal을 항상 켜고,
# 윈도우와 리눅스는 기본 CPU로 빌드하되 빌드 머신에 SDK가 있으면 아래 기능으로 켠다
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString", "NSObject"] }

[features]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 개발 빌드에서도 whisper.cpp, onnxruntime, 디코더는 최적화한다. 안 하면 전사가 수십 배 느려진다
[profile.dev.package."*"]
opt-level = 3
