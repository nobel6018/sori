[package]
name = "sori"
version = "0.4.4"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.16"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"] }
# 화자 분리는 sherpa-rs가 스레드를 1개로 고정해 두어 C API를 직접 부른다(src/engine/diarize.rs)
sherpa-rs-sys = { version = "=0.6.8", default-features = false }
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3", "wav", "flac", "ogg", "vorbis", "pcm", "alac", "mkv"] }
rubato = "0.16"
hound = "3.5"
eyre = "0.6.14"
thiserror = "2"
uuid = { version = "1.29.0", features = ["v4"] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1", features = ["sync", "process", "io-util", "time", "macros", "rt"] }
cpal = "0.18"
ureq = "2.12"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-deep-link = "=2.6.2"
# 딥링크를 열 때 앱이 하나 더 뜨지 않고, 이미 떠 있는 앱이 링크를 받게 한다
tauri-plugin-single-instance = { version = "=2.5.4", features = ["deep-link"] }

# whisper.cpp GPU 백엔드는 플랫폼마다 다르다. macOS는 Metal을 항상 켜고,
# 윈도우와 리눅스는 기본 CPU로 빌드하되 빌드 머신에 SDK가 있으면 아래 기능으로 켠다
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString", "NSObject"] }
# 회의 앱 감지: 마이크를 쓰는 프로세스 목록(macOS 14.0 이상)
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_System_Registry", "Win32_Foundation"] }

[features]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 개발 빌드에서도 whisper.cpp, onnxruntime, 디코더는 최적화한다. 안 하면 전사가 수십 배 느려진다
[profile.dev.package."*"]
opt-level = 3

# sherpa-rs-sys 빌드 스크립트는 cfg!(debug_assertions)이면 Windows에서 동적 디버그 C 런타임(msvcrtd)을 링크한다.
# 우리는 정적 런타임(/MT)으로 맞췄으므로 둘이 섞여 디버그 테스트 실행 파일이 시작 단계에서 멈췄다(릴리스는 정상).
# 빌드 스크립트만 debug_assertions를 꺼서 그 분기를 피한다. 우리 코드의 디버그 검사는 그대로다
[profile.dev.build-override]
debug-assertions = false
